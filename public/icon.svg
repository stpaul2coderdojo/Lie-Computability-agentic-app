<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#orbitGrad)" stroke-width="4" opacity="0.3"/>

  <!-- Lie Root Lattice Orbit Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>

  <!-- Non-Abelian Gauge Manifold / Quantum Tensor Contraction Orbits -->
  <ellipse cx="256" cy="256" rx="190" ry="80" fill="none" stroke="url(#orbitGrad)" stroke-width="8" transform="rotate(30 256 256)" filter="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="190" ry="80" fill="none" stroke="url(#orbitGrad)" stroke-width="8" transform="rotate(-30 256 256)" filter="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="190" ry="80" fill="none" stroke="url(#orbitGrad)" stroke-width="8" transform="rotate(90 256 256)" opacity="0.7"/>

  <!-- Tensor Nodes (Root System Generators) -->
  <circle cx="120" cy="180" r="14" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="392" cy="180" r="14" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="120" cy="332" r="14" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="392" cy="332" r="14" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="256" cy="70" r="16" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="256" cy="442" r="16" fill="#8b5cf6" filter="url(#glow)"/>

  <!-- Interconnecting Contraction Hyperedges -->
  <line x1="120" y1="180" x2="392" y2="332" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>
  <line x1="392" y1="180" x2="120" y2="332" stroke="#a855f7" stroke-width="3" opacity="0.6"/>
  <line x1="256" y1="70" x2="256" y2="442" stroke="#ec4899" stroke-width="3" opacity="0.6"/>

  <!-- Central Lie Commutator Core -->
  <circle cx="256" cy="256" r="38" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="24" fill="#ffffff"/>
  <path d="M246 244 L266 244 L256 268 Z" fill="#0f172a"/>
</svg>
